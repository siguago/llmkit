name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # No go.sum: this module has zero third-party dependencies.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify zero dependencies
        run: |
          # The selling point is a standard-library-only SDK. Fail loudly if a
          # third-party require ever sneaks into go.mod.
          if grep -qE '^\s*(require|\t)[^ ]+\.[^ ]+/' go.mod; then
            echo "go.mod gained a third-party dependency:"
            cat go.mod
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

      # The integration tests carry a build tag, so the run above never compiles
      # them — nothing else would catch a break in that file.
      - name: Vet integration tests
        run: go vet -tags=integration ./...

      # `go test` only runs the seed corpus. A short real fuzz run on every PR
      # is what actually exercises the parsers against bytes nobody thought to
      # write down — these targets take raw vendor input, so that is the class
      # of bug they exist to catch.
      - name: Fuzz parsers
        run: |
          set -e
          for target in \
            FuzzStreamReader_Strict \
            FuzzStreamReader_Tolerant \
            FuzzStreamReader_ToleranceSkipsParseErrors \
            FuzzStreamReader_FrameCeiling \
            FuzzDetectStreamError \
            FuzzExtractRetryAfter
          do
            echo "== $target"
            go test ./provider/compat/ -run '^$' -fuzz "^${target}$" -fuzztime=20s
          done
          for target in \
            FuzzParseDataURI \
            FuzzContentToString \
            FuzzContentToParts \
            FuzzDecodeToolCalls \
            FuzzExtractUsageFields \
            FuzzNormalizeUsage \
            FuzzRequestIDFromHeader \
            FuzzTruncateForLog
          do
            echo "== $target"
            go test ./provider/ -run '^$' -fuzz "^${target}$" -fuzztime=20s
          done

      # A crasher found above is written here. Surface it as an artifact so the
      # failing input can be added to the seed corpus rather than lost.
      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: |
            provider/testdata/fuzz/**
            provider/compat/testdata/fuzz/**
          if-no-files-found: ignore

      - name: Smoke-test llmkit-probe
        run: |
          go run ./cmd/llmkit-probe -list
          # With no keys configured it must exit non-zero with usage, not hang
          # or pretend to succeed.
          if go run ./cmd/llmkit-probe 2>/dev/null; then
            echo "probe should have failed with no keys configured"
            exit 1
          fi

  # go.mod declares the oldest Go this module actually compiles under. Testing
  # only on the newest toolchain would let a newer language feature raise that
  # floor silently, breaking users on older Go with no signal here.
  #
  # Deliberately just build + test: this job answers "does the declared floor
  # still hold", not "is everything green". The thorough checks — race, fuzz,
  # integration vet — belong on the primary toolchain above.
  #
  # This only became a real gate with setup-go v6, which sets GOTOOLCHAIN=local.
  # Before that the default GOTOOLCHAIN=auto meant raising go.mod to, say, 1.25
  # would make Go silently download 1.25 and build with it — the job stayed
  # green while the floor it exists to defend had already moved. Now the same
  # edit fails here with "go.mod requires go >= 1.25 (running go 1.22.x;
  # GOTOOLCHAIN=local)", which is the whole point. Do not pin setup-go back
  # below v6 without replacing this guarantee.
  min-go-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - run: go build ./...
      - run: go test ./... -count=1
