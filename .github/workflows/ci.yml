name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whitespace check compares the whole PR with its base, not just
          # the final commit or the post-tidy working tree.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # No go.sum: this module has zero third-party dependencies.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Verify zero dependencies
        env:
          GOTOOLCHAIN: local
        run: |
          # Check the resolved graph, not the spelling of go.mod: grouped,
          # indirect and tool dependencies must all fail this invariant.
          module_count=$(go list -m all | wc -l | tr -d ' ')
          if [ "$module_count" -ne 1 ]; then
            echo "module graph gained a dependency:"
            go list -m all
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            echo "go mod tidy created go.sum; the module is no longer dependency-free:"
            cat go.sum
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

      # The integration tests carry a build tag, so the run above never compiles
      # them — nothing else would catch a break in that file.
      - name: Vet integration tests
        run: |
          go vet -tags=integration ./...
          go test -tags=integration ./... -run '^$'

      # `go test` only runs the seed corpus. Exercise every fuzz target on each
      # PR with a fixed execution budget so this remains a strict, non-flaky
      # gate. Go can spuriously fail when a duration-based -fuzztime expires
      # (go.dev/issue/75804). The fix is on master but is in no released branch
      # as of go1.27rc2, so it lands in Go 1.28 — do not restore duration-based
      # runs when this job moves to 1.27. The scheduled deep-fuzz workflow
      # carries the larger search budget in the meantime.
      - name: Fuzz parsers
        id: fuzz
        run: |
          bash .github/scripts/run-fuzz.sh 100000x \
            ./provider/compat/ \
            ./provider/ \
            ./internal/sse/ \
            ./protocol/responses/ \
            ./protocol/anthropic/ \
            ./protocol/openaibatch/

      # Go writes a newly discovered failure under testdata/fuzz. Stage only
      # untracked files: tracked regression seeds already exist in the tree and
      # must not make an unrelated failure look like a newly found crasher.
      - name: Collect new fuzz failures
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        run: bash .github/scripts/collect-fuzz-crashers.sh "$RUNNER_TEMP/fuzz-crashers"

      - name: Upload fuzz failures
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuzz-crashers/
          if-no-files-found: ignore

      - name: Smoke-test llmkit-probe
        run: |
          go run ./cmd/llmkit-probe -list
          # With no keys configured it must exit non-zero with usage, not hang
          # or pretend to succeed.
          if go run ./cmd/llmkit-probe 2>/dev/null; then
            echo "probe should have failed with no keys configured"
            exit 1
          fi

  # go.mod declares the oldest Go this module actually compiles under. Testing
  # only on the newest toolchain would let a newer language feature raise that
  # floor silently, breaking users on older Go with no signal here.
  #
  # Deliberately just build + test: this job answers "does the declared floor
  # still hold", not "is everything green". The thorough checks — race, fuzz,
  # integration vet — belong on the primary toolchain above.
  #
  # This only became a real gate with setup-go v6, which sets GOTOOLCHAIN=local.
  # Before that the default GOTOOLCHAIN=auto meant raising go.mod to, say, 1.25
  # would make Go silently download 1.25 and build with it — the job stayed
  # green while the floor it exists to defend had already moved. Now the same
  # edit fails here with "go.mod requires go >= 1.25 (running go 1.22.x;
  # GOTOOLCHAIN=local)", which is the whole point. Do not pin setup-go back
  # below v6 without replacing this guarantee.
  min-go-version:
    runs-on: ubuntu-latest
    env:
      # Refuse toolchain auto-upgrade: this job must prove Go 1.22 itself can
      # build the module, not that Go 1.22 can download a newer compiler.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - run: go build ./...
      - run: go test ./... -count=1
      # The integration tests carry a build tag, so neither step above compiles
      # them. Without this the floor check stays green while tagged code quietly
      # starts depending on an API newer than the declared minimum.
      - run: go vet -tags=integration ./...

  # The v1 compatibility promise (STABILITY.md), made mechanical. Runs on the
  # newest Go rather than the 1.22 floor job: this checks the shape of the
  # exported API, not what the minimum toolchain can build.
  api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is the most recent release tag, so the tags have to
          # come along with the checkout.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      # apidiff runs through `go run` with a pinned version so it never lands
      # in go.mod and the zero-dependency gate above keeps passing.
      - name: Compare exported API against the last release
        run: bash .github/scripts/check-api-compat.sh
